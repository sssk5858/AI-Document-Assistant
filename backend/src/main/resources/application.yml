spring:
  application:
    name: backend

  # ===========================
  # PostgreSQL Configuration
  # ===========================
  datasource:
    url: jdbc:postgresql://localhost:5432/aidocdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # ===========================
  # JPA / Hibernate
  # ===========================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ===========================
  # File Upload
  # ===========================
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ===========================
# MinIO Configuration
# ===========================
minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: documents
